services:
  - type: web
    name: vidclaw
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: RUST_LOG
        value: info
      - key: FRONTEND_URL
        value: https://vidclaw.onrender.com
      # Set COOKIES_B64 in Render dashboard (base64-encoded cookies.txt)
      # Generate: base64 -w0 cookies.txt | pbcopy
      - key: COOKIES_B64
        sync: false
