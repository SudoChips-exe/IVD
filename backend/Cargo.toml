[package]
name = "video-downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2.5"
regex = "1.10"
env_logger = "0.11"
log = "0.4"
dotenv = "0.15"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4"] }
bytes = "1.5"
futures = "0.3"
chrono = "0.4"
tokio-stream = "0.1"

[dev-dependencies]
tokio-test = "0.4"
actix-web = { version = "4.4", features = ["macros"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
