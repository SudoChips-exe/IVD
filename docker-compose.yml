services:
  vidclaw:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - RUST_LOG=info
      - FRONTEND_URL=http://localhost
      # For Instagram/Facebook: base64 -w0 cookies.txt
      - COOKIES_B64=${COOKIES_B64:-}
    restart: unless-stopped
