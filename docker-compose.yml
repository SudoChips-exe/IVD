version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - RUST_LOG=info
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app/backend
    command: cargo run --manifest-path /app/backend/Cargo.toml

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: bun run dev

volumes:
  node_modules:
